<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>跨平台账号看板</title>
  <style>html,body,#root{margin:0;height:100%;overflow:hidden;}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#262a32}#startup{max-width:560px;margin:18vh auto;padding:28px;line-height:1.8}#startup h1{font-size:22px}#startup p{color:#626979}
.access-gate{--ink:#252832;--muted:#606878;--line:#dfe4ed;--paper:#f5f6f8;--card:#fff;--accent:#435ce0;--soft:#eef1fa;--error:#ad303d;box-sizing:border-box;height:100%;overflow:auto;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;padding:28px 24px 24px;color-scheme:light}
.access-gate[data-theme=dark]{--ink:#e8edf5;--muted:#aab6c7;--line:#394553;--paper:#161d25;--card:#1e2833;--accent:#a3b3ff;--soft:#293548;--error:#ffb1b8;color-scheme:dark}
.access-gate *{box-sizing:border-box}.access-brand{max-width:1040px;margin:auto;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.access-mark{color:var(--accent);font-size:26px;line-height:1}.access-brand button{margin-left:auto;width:44px;padding:0;font-size:22px}
.access-gate button{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;transition:background .15s,border-color .15s}.access-gate button:hover:not(:disabled){background:var(--soft);border-color:var(--accent)}.access-gate button:disabled{opacity:.55;cursor:default}.access-gate :is(button,input,summary):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.access-card{max-width:560px;margin:54px auto 28px;padding:36px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 35px #18294708}.access-eyebrow{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:12px}.access-card h1{font-size:27px;line-height:1.4;letter-spacing:-.6px;margin:0 0 14px;font-weight:650;text-wrap:balance}.access-intro{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.85}.access-card label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}.access-card input{display:block;width:100%;min-width:0;min-height:56px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:600 24px/1.5 ui-monospace,monospace;letter-spacing:3px;padding:10px 16px;text-transform:uppercase}.access-card input::placeholder{color:var(--muted);opacity:.7}.access-card input[aria-invalid=true]{border-color:var(--error)}.access-hint{font-size:12px;color:var(--muted);margin:8px 0 18px}.access-error{font-size:13px;color:var(--error);margin:0 0 16px;overflow-wrap:anywhere}
.access-gate .access-primary{width:100%;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}.access-gate[data-theme=dark] .access-primary{color:#17213c}.access-gate .access-primary:hover:not(:disabled){background:var(--accent);filter:brightness(.94)}.access-banner{background:var(--soft);border-left:3px solid var(--accent);padding:12px 14px;margin:0 0 22px;font-size:13px}
.access-guidance{border-top:1px solid var(--line);margin-top:28px;padding-top:22px;font-size:13px}.access-guidance h2{font-size:14px;margin:0 0 10px;font-weight:600}.access-guidance ol{padding-left:19px;margin:0 0 14px;color:var(--muted)}.access-guidance li+li{margin-top:8px}.access-guidance strong{font-weight:500;color:var(--ink)}.access-guidance summary{min-height:44px;padding:10px 0;color:var(--accent);cursor:pointer}.access-guidance p{color:var(--muted);margin:8px 0}.access-guidance code{background:var(--soft);padding:4px 7px;border-radius:4px;font:12px/1.8 ui-monospace,monospace;overflow-wrap:anywhere}.access-gate footer{max-width:560px;margin:auto;text-align:center;color:var(--muted);font-size:12px}
.psw .access-settings{display:grid;gap:16px;min-width:0}.psw .access-settings>p{color:var(--muted);font-size:13px;line-height:1.8}.psw .access-settings .access-notice{color:var(--green)}.psw .access-settings .psw-field-error{color:var(--danger)}.psw .access-settings h3{margin-top:8px}.psw .access-pair{padding:20px;border:1px solid var(--line);background:var(--soft);border-radius:12px;min-width:0;display:grid;gap:10px}.psw .access-caption{font-size:13px;color:var(--muted)}.psw .access-code-row,.psw .access-address{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.psw .access-code-row>code{font:600 24px/1.5 ui-monospace,monospace;color:var(--ink);letter-spacing:2px;overflow-wrap:anywhere}.psw .access-address code{font:13px/1.8 ui-monospace,monospace;overflow-wrap:anywhere;min-width:0}.psw .access-pair p{font-size:12px;color:var(--muted)}.psw .access-session{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.psw .access-session-info{min-width:0;flex:1 1 240px;display:grid;gap:6px}.psw .access-session-info strong{display:flex;align-items:center;flex-wrap:wrap;gap:8px;overflow-wrap:anywhere;font-size:14px}.psw .access-session-info>span{color:var(--muted);font-size:12px;line-height:1.8}.psw .access-current{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px}.psw .access-confirm{flex-basis:100%;padding:14px;background:var(--soft);border-radius:9px}.psw .access-confirm p{font-size:13px;margin-bottom:10px}
@media(max-width:600px){.access-gate{padding:16px}.access-card{margin-top:24px;padding:24px 20px}.access-card h1{font-size:24px}.access-intro{margin-bottom:24px}.access-gate footer{padding:0 8px}.psw .access-pair{padding:14px}.psw .access-code-row>code{font-size:22px}}
@media(prefers-reduced-motion:reduce){.access-gate *{transition:none!important}}
</style>
</head>
<body>
  <div id="root"><main id="startup" role="status"><h1>跨平台账号看板</h1><p>正在打开本机工作台…</p></main></div>
  <script type="module" src="/assets/standalone.js"></script>
</body>
</html>
